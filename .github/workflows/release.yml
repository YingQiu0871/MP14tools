# Builds the release binary on a GitHub runner and publishes it, so a release no
# longer depends on whichever toolchain happens to be installed on a local
# machine.
#
# The build is exactly the one README describes - the GNU toolchain plus the
# project-local dlltool/as pair and windres. The last two cannot come from the
# checkout: `build\` is gitignored, and `build.rs` only *warns* when windres is
# missing, which would silently ship an executable without its icon and version
# block. So the runner installs them the documented way, through
# tools\install-mingw.ps1, and then verifies what it is about to upload.
#
# Code signing (SignPath Foundation, see docs/code-signing.md) is optional and
# off by default: every signing step below runs only when the repository
# variable SIGNPATH_ORGANIZATION_ID is non-empty, so with it unset this workflow
# builds and publishes exactly the unsigned files it always did. Also read:
# variables SIGNPATH_PROJECT_SLUG and SIGNPATH_POLICY_SLUG (default
# release-signing), secret SIGNPATH_API_TOKEN.
#
# Triggers:
#   * pushing a `v*` tag     - the normal path
#   * "Run workflow"         - for a tag that was pushed before this workflow
#                              existed; pass the tag in the input
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (for example v0.2.9)
        required: true
        type: string

# gh release create needs to write releases; nothing else is touched.
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      # build.ps1 prepends the GNU rustlib directories, but cargo/rustc come from
      # the rustup shims, so the toolchain has to be selected here.
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Agree on the version
        id: version
        shell: pwsh
        run: |
          $tag = '${{ inputs.tag || github.ref_name }}'
          $version = $tag -replace '^v', ''

          # The tag is the release name; the manifest is what the version block
          # of the executable is filled from. Letting them disagree would ship a
          # binary whose properties do not match the release it is attached to.
          $manifest = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"$').Matches[0].Groups[1].Value.Trim()
          if ($manifest -ne $version) {
              throw "Cargo.toml says $manifest, the tag says $version"
          }

          Write-Host "tag $tag, version $version"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install the GNU Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal

          # `--profile minimal` is not enough to *link*: the crt objects the GNU
          # target needs (crt2.o, crtbegin.o) and the import libraries
          # (-lkernel32, -lmingw32, -lmingwex, -lmsvcrt) ship in this component.
          # Without it the first build script dies with
          #     ld: cannot find crt2.o: No such file or directory
          #     ld: cannot find -lkernel32: No such file or directory
          rustup component add rust-mingw --toolchain stable-x86_64-pc-windows-gnu

      - name: Pin the GNU linker
        shell: pwsh
        # Runner images carry MinGW directories on PATH, and letting rustc pick
        # one of those up breaks the link the same way tools\install-mingw.ps1
        # warns about ("cannot find crt2.o"). So point rustc at rustup's own
        # linker shim, next to which its crt objects and import libraries live.
        run: |
          $sysroot = (rustc --print sysroot).Trim()
          $linker = Join-Path $sysroot 'lib\rustlib\x86_64-pc-windows-gnu\bin\self-contained\x86_64-w64-mingw32-gcc.exe'

          if (-not (Test-Path $linker)) {
              throw "no GNU linker at $linker - the rust-mingw component is missing"
          }

          Write-Host "linker: $linker"
          "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=$linker" >> $env:GITHUB_ENV

      - name: Cache the MinGW-w64 toolchain
        uses: actions/cache@v6
        with:
          path: build/toolchain
          # Tied to the installer: a changed installer may want a different
          # MinGW-w64, and then reusing the old one would be wrong.
          key: winlibs-mingw64-${{ runner.os }}-${{ hashFiles('tools/install-mingw.ps1') }}

      - name: Install windres and the dlltool/as pair
        shell: pwsh
        # No-ops when the cache above was restored.
        run: .\tools\install-mingw.ps1

      - name: Build the release binary
        shell: pwsh
        run: |
          $output = & .\build.ps1 -Release *>&1 | Out-String
          $code = $LASTEXITCODE
          $output | Set-Content -Path build\ci-build.log -Encoding utf8
          Write-Host $output

          if ($code -ne 0) { throw "build.ps1 exited with $code" }

          # A missing or failing windres is only a warning in build.rs, and that
          # is the one warning that must not reach a release.
          if ($output -match 'windres not found|windres failed|could not run windres') {
              throw 'the resource compiler did not run; the icon and version block would be missing'
          }

      - name: Check the binary that is about to ship
        id: check
        shell: pwsh
        run: |
          $exe = 'build\obj\release\mp14tools.exe'
          $info = (Get-Item $exe).VersionInfo
          $expected = '${{ steps.version.outputs.version }}.0'
          # An empty string when the resource block is missing, instead of a
          # confusing "cannot call a method on a null-valued expression".
          $fileVersion = "$($info.FileVersion)".Trim()

          if ($fileVersion -ne $expected) {
              throw "$exe carries FileVersion '$fileVersion', expected $expected"
          }

          $size = (Get-Item $exe).Length
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          Write-Host "$exe : FileVersion $fileVersion, $size bytes, SHA256 $hash"

          "fileVersion=$fileVersion" >> $env:GITHUB_OUTPUT
          "size=$size" >> $env:GITHUB_OUTPUT
          "hash=$hash" >> $env:GITHUB_OUTPUT

          # Same figures the release body quotes, straight from the binary that
          # is uploaded.
          @(
              '### release asset'
              ''
              "- ``mp14tools.exe`` - $([math]::Round($size / 1MB, 2)) MB"
              "- SHA256: ``$hash``"
              "- FileVersion: ``$fileVersion``"
          ) >> $env:GITHUB_STEP_SUMMARY

      - name: Upload the exe for signing
        id: exe-unsigned
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: exe-unsigned
          path: build/obj/release/mp14tools.exe
          if-no-files-found: error

      - name: Sign the exe (SignPath)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.exe-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: build/signed-exe

      - name: Use the signed exe
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: |
          $exe = 'build\obj\release\mp14tools.exe'
          Copy-Item build\signed-exe\mp14tools.exe $exe -Force

          $signature = Get-AuthenticodeSignature $exe
          if ($signature.Status -ne 'Valid') {
              throw "$exe is not validly signed: $($signature.Status)"
          }
          Write-Host "$exe signed by $($signature.SignerCertificate.Subject)"

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
          wix extension add --global WixToolset.Util.wixext/5.0.2

      - name: Build the MSI installer
        id: msi
        shell: pwsh
        # Packages the exe that was just checked; the MSI version comes from
        # Cargo.toml, which the version step already matched against the tag.
        run: |
          .\installer\build-msi.ps1 -ExePath build\obj\release\mp14tools.exe
          $msi = Get-Item build\msi\*.msi
          "name=$($msi.Name)" >> $env:GITHUB_OUTPUT
          "size=$($msi.Length)" >> $env:GITHUB_OUTPUT
          @(
              "- ``$($msi.Name)`` - $([math]::Round($msi.Length / 1MB, 2)) MB (per-user Windows Installer package)"
              "- SHA256: ``$((Get-FileHash $msi.FullName -Algorithm SHA256).Hash)``"
          ) >> $env:GITHUB_STEP_SUMMARY

      - name: Upload the MSI for signing
        id: msi-unsigned
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: msi-unsigned
          path: build/msi/*.msi
          if-no-files-found: error

      - name: Sign the MSI (SignPath)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: msi
          github-artifact-id: ${{ steps.msi-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: build/signed-msi

      - name: Use the signed MSI
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: |
          $original = Get-Item build\msi\*.msi
          $signed = Get-Item build\signed-msi\*.msi
          Copy-Item $signed.FullName $original.FullName -Force

          $signature = Get-AuthenticodeSignature $original.FullName
          if ($signature.Status -ne 'Valid') {
              throw "$($original.Name) is not validly signed: $($signature.Status)"
          }
          Write-Host "$($original.Name) signed by $($signature.SignerCertificate.Subject)"

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build/ci-build.log
          if-no-files-found: ignore

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $version = '${{ steps.version.outputs.version }}'
          $asset = 'build\obj\release\mp14tools.exe'
          $msi = (Get-Item build\msi\*.msi).FullName
          $msiHash = (Get-FileHash $msi -Algorithm SHA256).Hash
          # Taken here, after any signing, so the figures describe the files
          # that are actually attached (signing changes size and hash).
          $exeSize = (Get-Item $asset).Length
          $exeHash = (Get-FileHash $asset -Algorithm SHA256).Hash
          $msiSize = (Get-Item $msi).Length

          # The body is the checked-in notes when the tag has them (see
          # docs/releases), plus the facts of the binary that is actually
          # attached - taken from the run instead of written by hand, so the
          # numbers on the release page cannot go stale.
          $notes = "docs/releases/$tag.md"
          $body = Join-Path $env:RUNNER_TEMP 'release-body.md'
          if (Test-Path $notes) {
              Copy-Item $notes $body
          } else {
              Set-Content -Path $body -Value "# MP14Tools $version" -Encoding utf8
          }

          Add-Content -Path $body -Value ''
          Add-Content -Path $body -Value '### release asset'
          Add-Content -Path $body -Value ''
          Add-Content -Path $body -Value "- ``mp14tools.exe`` - $exeSize bytes"
          Add-Content -Path $body -Value "- SHA256: ``$exeHash``"
          Add-Content -Path $body -Value "- FileVersion: ``${{ steps.check.outputs.fileVersion }}``"

          Add-Content -Path $body -Value "- ``$(Split-Path $msi -Leaf)`` - $msiSize bytes (installer, per-user, no admin rights)"
          Add-Content -Path $body -Value "  - SHA256: ``$msiHash``"

          if (gh release view $tag 2>$null) {
              # A release for this tag already exists - replace its asset and its
              # body instead of failing the run.
              gh release upload $tag $asset $msi --clobber
              gh release edit $tag --notes-file $body
              return
          }

          gh release create $tag --title "MP14Tools $version" --verify-tag --notes-file $body $asset $msi
